# Fly.io config for the Ninja Trade oracle keeper.
# A worker process (no inbound HTTP), so there is no [http_service] block.
#
# First deploy:
#   fly launch --no-deploy --copy-config --name ninja-oracle-keeper
#   fly secrets set RPC_URL="https://devnet.helius-rpc.com/?api-key=YOUR_KEY"
#   fly secrets set KEEPER_SECRET_KEY="$(base64 -i ~/.config/solana/mukon-deployer.json)"
#   fly deploy
#
# Set primary_region to match your other Mukon apps (fly platform regions).

app = "ninja-oracle-keeper"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret defaults. RPC_URL and KEEPER_SECRET_KEY come from `fly secrets`.
  # PROGRAM_ID defaults to the deployed checkpoint-v2 program in the code.

# Single always-on machine — the keeper must run continuously. Fly restarts
# the machine if the process exits.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # Only ever one keeper — two would double-push prices (harmless but wasteful).
  strategy = "immediate"
